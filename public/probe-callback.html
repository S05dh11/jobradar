<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#05080f">
<div id="a" style="position:absolute;inset:0"></div>
<div id="tag" style="position:fixed;left:8px;top:8px;z-index:9;color:#22d3ee;font:12px monospace">bootstrapping…</div>
<script>
  // 探针 B:官方异步引导——&callback= 由高德在 API 完全就绪后调用
  window.__amapReady = function () {
    try {
      new AMap.Map(document.getElementById("a"), {
        center: [120.15, 30.28], zoom: 10,
        mapStyle: "amap://styles/darkblue", viewMode: "2D", resizeEnable: true,
      });
      document.getElementById("tag").textContent = "callback path: new AMap.Map() done";
    } catch (e) {
      document.getElementById("tag").textContent = "callback path THREW: " + e.message;
    }
  };
  var s = document.createElement("script");
  s.src = "https://webapi.amap.com/maps?v=2.0&key=your-amap-key&callback=__amapReady";
  s.onerror = function () { document.getElementById("tag").textContent = "script onerror"; };
  document.head.appendChild(s);
</script>
